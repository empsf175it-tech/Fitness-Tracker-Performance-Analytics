<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseForge — Secure Athlete Authentication &amp; Portal</title>
  <meta name="description" content="Sign in to your PulseForge biometric telemetry dashboard. Access coach programming, nutrition sync, and recovery analytics.">
  <meta name="keywords" content="fitness authentication, athlete login, coach portal, biometric dashboard signin">
  <meta name="author" content="PulseForge Engineering">
  <link rel="canonical" href="https://pulseforge.io/login.html">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PulseForge — Secure Athlete Portal">
  <meta property="og:description" content="Sign in to your PulseForge biometric telemetry dashboard. Access coach programming and recovery metrics.">
  <meta property="og:image" content="assets/images/hero/hero-runner.jpg">
  <meta property="og:url" content="https://pulseforge.io/login.html">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PulseForge — Portal Login">
  <meta name="twitter:description" content="Access your biometric dashboard and coach telemetry.">
  <meta name="twitter:image" content="assets/images/hero/hero-runner.jpg">

  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "PulseForge Athlete Authentication",
    "description": "Sign in to your PulseForge biometric telemetry dashboard.",
    "url": "https://pulseforge.io/login.html"
  }
  </script>

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 24px;
      position: relative;
    }
    .auth-brand-header {
      margin-bottom: 28px;
      text-align: center;
    }
    .auth-brand-header a {
      display: inline-block;
      text-decoration: none;
      transition: transform var(--transition-fast);
    }
    .auth-brand-header a:hover {
      transform: scale(1.03);
    }
    .auth-brand-header img {
      height: 48px;
      width: auto;
      display: block;
    }
    .auth-card-wrapper {
      display: flex;
      max-width: 920px;
      width: 100%;
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-glow);
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .auth-hero-banner {
      flex: 1;
      min-height: 520px;
      position: relative;
      background: url('assets/images/hero/auth-motivational.jpg') center/cover no-repeat;
      display: block;
    }
    .auth-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,26,31,0.15) 0%, rgba(7,26,31,0.88) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 36px 28px;
    }
    .auth-form-card {
      flex: 1.1;
      padding: 40px;
      background: transparent;
    }
    @media (max-width: 768px) {
      .auth-hero-banner {
        display: none;
      }
      .auth-card-wrapper {
        max-width: 460px;
      }
    }
    .auth-tabs {
      display: flex;
      width: 100%;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      background: none;
      border: none;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      padding: 10px 16px 14px;
      transition: color var(--transition-fast);
      position: relative;
    }
    .auth-tab-btn:hover {
      color: var(--text-sand);
    }
    .auth-tab-btn.active {
      color: var(--electric-lime);
    }
    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: var(--electric-lime);
      box-shadow: 0 0 12px var(--electric-lime);
      border-radius: 2px 2px 0 0;
    }
    .input-pw-wrap {
      position: relative;
    }
    .btn-toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .demo-auth-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(244, 239, 230, 0.08);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="custom-cursor"></div>
  <div class="custom-cursor-follower"></div>

  <div class="auth-page-container">
    <!-- Centered Brand Logo -->
    <div class="auth-brand-header">
      <a href="index.html" aria-label="PulseForge Home">
        <img src="assets/images/logo.png" alt="PulseForge Logo">
      </a>
    </div>

    <!-- Centered Interactive Authentication Card with Hero Visual -->
    <div class="auth-card-wrapper">
      <div class="auth-hero-banner">
        <div class="auth-hero-overlay">
          <div style="font-family: var(--font-display); font-size: 1.55rem; font-weight: 800; color: var(--text-sand); line-height: 1.2; margin-bottom: 8px;">FUEL. RECOVER. PERFORM.</div>
          <p style="font-size: 0.88rem; color: var(--recovery-aqua); line-height: 1.4; margin: 0;">Join over 180,000 elite athletes and accredited coaches engineering their highest potential.</p>
        </div>
      </div>

      <div class="auth-form-card">
        <h1 style="font-size:1.45rem; font-weight:800; margin-bottom:18px; color:var(--text-sand); text-align:center;">Athlete Portal &amp; Telemetry Sign In</h1>
      <!-- Auth Tabs: Login vs Signup -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLogin">Sign In</button>
        <button class="auth-tab-btn" id="tabSignup">Create Account</button>
      </div>

        <!-- FORM 1: LOGIN -->
        <form id="formLogin">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input class="form-input" type="email" name="email" required placeholder="athlete@pulseforge.io" value="athlete@pulseforge.io">
          </div>

          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label">Password</label>
            <div class="input-pw-wrap">
              <input class="form-input" type="password" name="password" required placeholder="••••••••" value="PulseAthlete123!">
              <button type="button" class="btn-toggle-pw" title="Show / Hide Password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:0.85rem;">
            <div style="display:flex; align-items:center; gap:8px; color:var(--text-muted);">
              <input type="checkbox" id="rememberMe" checked style="accent-color:var(--electric-lime); cursor:pointer;">
              <label for="rememberMe" style="cursor:pointer;">Keep me signed in</label>
            </div>
            <a href="#" id="linkForgotPassword" style="font-size:0.84rem; color:var(--electric-lime); text-decoration:none; transition:opacity 0.2s;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
            Sign In to PulseForge
          </button>
        </form>

        <!-- FORM 2: SIGNUP -->
        <form id="formSignup" style="display:none;">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input class="form-input" type="text" name="name" required placeholder="Elena Rostova">
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input class="form-input" type="email" name="email" required placeholder="athlete@domain.com">
          </div>

          <div class="form-group">
            <label class="form-label">Create Password (min. 6 characters)</label>
            <div class="input-pw-wrap">
              <input class="form-input" type="password" name="password" required minlength="6" placeholder="••••••••">
              <button type="button" class="btn-toggle-pw" title="Show / Hide Password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Account Role</label>
            <select class="form-select" name="role">
              <option value="client">Athlete Client (Personal Telemetry)</option>
              <option value="coach">Performance Coach (Manage Roster)</option>
              <option value="admin">Clinic / Team Administrator</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
            Create PulseForge Account
          </button>
        </form>

        <!-- 1-Click Demo Logins -->
        <div class="demo-auth-box">
          <div style="font-size:0.8rem; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:12px; letter-spacing:0.08em;">
            Instant 1-Click Demo Evaluation
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <button class="btn btn-outline btn-sm" data-demo-login="client" style="width:100%; justify-content:center;">
              🏃 Athlete Demo (Elena Rostova)
            </button>
            <button class="btn btn-outline btn-sm" data-demo-login="coach" style="width:100%; justify-content:center;">
              🏋️‍♂️ Coach Demo (Coach Marcus)
            </button>
            <button class="btn btn-outline btn-sm" data-demo-login="admin" style="width:100%; justify-content:center;">
              👑 Admin Demo (Dr. Julian Cross)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
